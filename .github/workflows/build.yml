name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # glibc 2.34: the built module loads on RHEL/Alma/Rocky 9, Ubuntu 22.04 and newer.
    container: almalinux:9
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          dnf -y install gcc clang-devel git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: cargo test --locked
      - name: Installer guard tests
        run: bash tests/guard.sh
      - name: Build
        run: |
          cargo build --release --locked
          cp target/release/libhatch.so hatch-${{ matrix.arch }}-linux-gnu.so
          objdump -T hatch-${{ matrix.arch }}-linux-gnu.so | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: hatch-${{ matrix.arch }}
          path: hatch-${{ matrix.arch }}-linux-gnu.so

  integration:
    name: integration ${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hatch-${{ matrix.arch }}
      - name: Installer watcher tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq inotify-tools
          bash tests/watch.sh
      - name: Real OpenLiteSpeed
        run: bash tests/integration.sh hatch-${{ matrix.arch }}-linux-gnu.so

  # CyberPanel ships its own OpenLiteSpeed core with a longer lsi_api_t. Its core is x86_64 only.
  integration-cyberpanel:
    name: integration x86_64 CyberPanel
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hatch-x86_64
      - name: CyberPanel OpenLiteSpeed core
        run: HATCH_CYBERPANEL=1 HATCH_BUILD_CYBERPANEL=1 PORT=18094 bash tests/integration.sh hatch-x86_64-linux-gnu.so

  integration-el10:
    name: integration ${{ matrix.arch }} AlmaLinux 10
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # The module is built on glibc 2.34; this proves it loads on EL10 (glibc 2.39) with the OpenLiteSpeed RPM.
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hatch-${{ matrix.arch }}
      - name: OpenLiteSpeed from the LiteSpeed repo
        run: |
          dnf -y install libatomic procps-ng
          curl -fsSL https://repo.litespeed.sh | bash
          dnf -y install openlitespeed
          /usr/local/lsws/bin/openlitespeed -v
          /usr/local/lsws/bin/lswsctrl start </dev/null >/dev/null 2>&1
          sleep 3
      - name: Integration
        run: HATCH_LOCAL=1 bash tests/integration.sh hatch-${{ matrix.arch }}-linux-gnu.so

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [integration, integration-el10, integration-cyberpanel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum hatch-*-linux-gnu.so > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" hatch-*-linux-gnu.so SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "hatch $GITHUB_REF_NAME" --generate-notes
