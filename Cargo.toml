[package]
name = "hatch"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Apache .htaccess compatibility module for OpenLiteSpeed"
repository = "https://github.com/prabowosd/hatch"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# unicode-case is what case_insensitive(true) needs; without it SetEnvIfNoCase cannot compile.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

[build-dependencies]
bindgen = "0.71"
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
